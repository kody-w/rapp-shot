name: RAPPShot
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
packages:
  RAPPDesktopSupport:
    url: https://github.com/kody-w/rapp-tools.git
    revision: f0bc616c2aed34f2a88888806ed056ec7bafba61
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "130"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  RAPPShotCore:
    type: framework
    platform: macOS
    sources:
      - Sources/RAPPShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.shot.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  RAPPShot:
    type: application
    platform: macOS
    sources:
      - Sources/RAPPShot
    dependencies:
      - target: RAPPShotCore
        embed: true
      - package: RAPPDesktopSupport
        product: RAPPDesktopSupport
    settings:
      base:
        PRODUCT_NAME: RAPPShot
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.shot
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Signing/RAPPShot.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  RAPPShotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RAPPShotCoreTests
    dependencies:
      - target: RAPPShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.shot.coretests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RAPPShot:
    build:
      targets:
        RAPPShot: all
        RAPPShotCoreTests: [test]
    test:
      targets:
        - RAPPShotCoreTests
    archive:
      config: Release
