name: Native macOS verification

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out the exact run source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare developer tooling
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          swift --version
          xcodegen --version

      - name: Safe synthetic native verification
        run: python3 tools/native_ci.py

      - name: Retain verification logs (not signing evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-verification-${{ matrix.os }}-${{ github.sha }}
          path: |
            .test-artifacts/native-ci-*/report.json
            .test-artifacts/native-ci-*/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
